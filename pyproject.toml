[project]
name = "pc-clusterizacao"
version = "0.1.0"
description = "Clusterização não supervisionada de imagens de fundo de olho (HYGD) com K-Means"
readme = "README.md"
authors = [
    { name = "Luiz Eduardo", email = "57048776+luizcodedthat@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "torch==2.14.1+cu130",
    "torchvision==0.29.1+cu130",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"
